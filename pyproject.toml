[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyfastspm"
authors = [{ name = "Carlo Dri", email = "carlo.dri@gmail.com" }]
description = "A python package for loading, processing and exporting scanning probe microscopy movies acquired with the FAST unit."
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://gitlab.com/fastspm/pyfastspm"
Issues = "https://gitlab.com/fastspm/pyfastspm/-/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pyfastspm/_version.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
h5py = ">=3.16.0,<4"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
scikit-image = ">=0.26.0,<0.27"
pillow = ">=12.2.0,<13"
matplotlib = ">=3.10.8,<4"
loguru = ">=0.7.3,<0.8"
tqdm = ">=4.67.3,<5"
ffmpeg = ">=8.0.1,<9"
mkl_fft = ">=2.1.2,<3"
gsffile = ">=0.5.4,<0.6"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.15.11,<0.16"
ty = ">=0.0.31,<0.0.32"
pytest = ">=9.0.3,<10"
pytest-cov = ">=7.1.0,<8"
nbmake = ">=1.5.5,<2"
hatch = ">=1.16.5,<2"
pytest-sugar = ">=1.1.1,<2"
sphinx = ">=8.1.3,<9"
furo = ">=2024.8.6,<2025"
rattler-build = ">=0.23.0"
python-build = ">=1.2.2"

[tool.pixi.pypi-dependencies]
pyfastspm = { path = ".", editable = true }

[tool.pixi.environments]
default = []
dev = ["dev"]

[tool.pixi.tasks]
lint = { cmd = "ruff check --fix .", default-environment = "dev" }
format = { cmd = "ruff format .", default-environment = "dev" }
typecheck = { cmd = "ty check", default-environment = "dev" }
test = { cmd = "pytest -vx", default-environment = "dev" }
test_notebook = { cmd = "pytest -vx --nbmake examples/pyfastspm_converter.ipynb", default-environment = "dev" }
docs = { cmd = "cd docs && make html", default-environment = "dev" }
build_conda = { cmd = "rattler-build build --recipe recipe.yaml", default-environment = "dev" }
build_pypi = { cmd = "hatch build", default-environment = "dev" }
publish_pypi = { cmd = "hatch publish", default-environment = "dev", depends-on = ["build_pypi"] }

[tool.ruff]
line-length = 88
exclude = ["*.ipynb", "docs"]

[tool.ty.src]
include = ["pyfastspm", "tests"]
