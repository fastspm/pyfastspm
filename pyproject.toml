[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyfastspm"
authors = [{ name = "Carlo Dri", email = "carlo.dri@gmail.com" }]
description = "A python package for loading, processing and exporting scanning probe microscopy movies acquired with the FAST unit."
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://gitlab.com/fastspm/pyfastspm"
Issues = "https://gitlab.com/fastspm/pyfastspm/-/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pyfastspm/_version.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
h5py = ">=3.16.0,<4"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
scikit-image = ">=0.26.0,<0.27"
pillow = ">=12.2.0,<13"
matplotlib = ">=3.10.8,<4"
loguru = ">=0.7.3,<0.8"
tqdm = ">=4.67.3,<5"
ffmpeg = ">=8.0.1,<9"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.15.11,<0.16"
ty = ">=0.0.31,<0.0.32"
pytest = ">=9.0.3,<10"
pytest-cov = ">=7.1.0,<8"
nbmake = ">=1.5.5,<2"
hatch = ">=1.16.5,<2"

[tool.pixi.pypi-dependencies]
pyfastspm = { path = ".", editable = true }

[tool.pixi.environments]
default = []
dev = ["dev"]

[tool.pixi.tasks]
lint = "ruff check --fix ."
format = "ruff format ."
typecheck = "ty check"
test = "pytest"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Parsing dates involving a day of month without a year specified is ambiguous:DeprecationWarning"
]

[tool.ty.environment]
python-version = "3.10"
python-platform = "linux"

[tool.ty.src]
include = ["pyfastspm", "tests"]
