[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyfastspm"
dynamic = ["version"]
description = "Python package for loading, processing, and exporting SPM movies acquired with the FAST module."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Carlo A. Pignedoli", email = "carlo.pignedoli@empa.ch"},
    {name = "Daniele Passerone", email = "daniele.passerone@empa.ch"}
]
dependencies = [
    "h5py",
    "numpy",
    "scipy",
    "scikit-image",
    "pillow",
    "matplotlib",
    "loguru",
    "tqdm",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pyfastspm/_version.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
ffmpeg = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
ty = "*"
pytest = "*"
pytest-cov = "*"
nbmake = "*"

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "ty check"
test = "pytest"
