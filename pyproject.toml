[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyfastspm"
authors = [{ name = "Carlo Dri", email = "carlo.dri@gmail.com" }]
description = "A python package for loading, processing and exporting scanning probe microscopy movies acquired with the FAST unit."
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "h5py",
    "numpy",
    "scipy",
    "scikit-image",
    "pillow",
    "matplotlib",
    "loguru",
    "tqdm",
]

[project.urls]
Homepage = "https://gitlab.com/fastspm/pyfastspm"
Issues = "https://gitlab.com/fastspm/pyfastspm/-/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pyfastspm/_version.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
ffmpeg = "*"
ruff = "*"
ty = "*"
pytest = "*"
pytest-cov = "*"
nbmake = "*"
hatch = "*"

[tool.pixi.pypi-dependencies]
pyfastspm = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "ty check"
test = "pytest"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.10"
python-platform = "linux"

[tool.ty.src]
include = ["pyfastspm", "tests"]
