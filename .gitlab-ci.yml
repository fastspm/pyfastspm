workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PIXI_LOCKED: "true"

default:
  image: ghcr.io/prefix-dev/pixi:latest
  before_script:
    - pixi global install git

stages:
  - test
  - build
  - release

test_job:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - pixi run lint
    - pixi run test
    - pixi run test_notebook

build_job:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - pixi run build_pypi
  artifacts:
    paths:
      - dist/

release_pypi:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: test_job
    - job: build_job
  script:
    - pixi run publish_pypi

pages:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build_job
  script:
    - mkdir public
    - cd docs/
    - pixi run sphinx-apidoc --private --force -d 0 --no-headings --module-first
      --no-toc -o API/ ../pyfastspm
    - pixi run sphinx-build -b html -d _build/doctrees . _build/html
    - mv -v _build/html/* ../public/
  artifacts:
    paths:
      - public
