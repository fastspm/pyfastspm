default:
  image: ghcr.io/prefix-dev/pixi:latest
  before_script:
    - pixi global install git

stages:
  - test
  - build
  - release

test_job:
  stage: test
  script:
    - pixi run lint
    - pixi run test
    - pixi run test_notebook

build_job:
  stage: build
  script:
    - pixi run build_pypi
  artifacts:
    paths:
      - dist/

release_pypi:
  stage: release
  only:
    - tags
  script:
    - pixi run publish_pypi

pages:
  stage: release
  only:
    - tags
  script:
    - mkdir public
    - cd docs/
    - pixi run sphinx-apidoc --private --force -d 0 --no-headings --module-first
      --no-toc -o API/ ../pyfastspm
    - pixi run sphinx-build -b html -d _build/doctrees . _build/html
    - mv -v _build/html/* ../public/
  artifacts:
    paths:
      - public
